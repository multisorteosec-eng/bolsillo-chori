<style>

</style></head><body>
<header><b>🌳 Bolsillo Chori</b><div id="who"></div></header>
<main id="app"></main>
<script>
const KEY='bolsillo_chori_v1',MS={hora:36e5,día:864e5,semana:6048e5,quincena:12096e5,mes:2419200000},MAXN={hora:8640,día:360,semana:52,quincena:24,mes:12};
let S={pin:'1234',cob:[],cre:[]},U=null,tab='cartera',sel=null,RC=null,LS=null,EC=null,RF='',MF='',RK=null,LR=null,KR=null,REF=null,SHOWP=false;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
let BAKS=null;try{const b=localStorage.getItem(KEY+'_bak');if(b)BAKS=JSON.parse(b)}catch(e){}
let lastBk=0;const save=()=>{if(S&&S.__sc)return;try{S.sv=Date.now();if(S.pin&&!String(S.pin).startsWith('h:'))S.pin=PHS(S.pin);(S.cob||[]).forEach(o=>{if(o.pin&&!String(o.pin).startsWith('h:'))o.pin=PHS(o.pin)});const prev=localStorage.getItem(KEY);if(prev&&prev.length>300&&Date.now()-lastBk>120000){localStorage.setItem(KEY+'_bak',prev);lastBk=Date.now()}const cur=JSON.stringify(S);localStorage.setItem(KEY,cur);snapDia(cur)}catch(e){}try{if(typeof SYNC!=='undefined')SYNC.touch()}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>{const v=Math.round(n*100)/100;return '$'+v.toLocaleString('es-CO',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})};
const fd=(t,u)=>new Date(t).toLocaleString('es-CO',u==='hora'?{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}:{weekday:'short',day:'2-digit',month:'short',year:'2-digit'});
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
function dv(c){const a=[];let d=new Date(c.start);for(let k=1;k<=c.n;k++){if(c.nod){do{d.setDate(d.getDate()+1)}while(d.getDay()===0)}else d=new Date(c.start+k*MS[c.unit]);a.push(d.getTime())}return a}
function sim(c,pay){const D=dv(c),flat=c.flat||c.tb==='total';if(c.tb==='mes'&&!c.flat){const dr=(c.tasa||0)/100/28,end=D.length?D[D.length-1]:Date.now(),P=c.pagos.slice().sort((x,y)=>x.t-y.t);let cp=c.monto,iv=0,tp=c.start;const upto=t=>{const tt=Math.min(t,end);if(tt>tp){iv+=cp*dr*(tt-tp)/864e5;tp=tt}};P.forEach(p=>{upto(p.t);iv-=p.int;cp-=p.cap});upto(Date.now());return{cap:cp,i:Math.max(0,iv)}}const r=c.interes/c.monto/c.n,cm=t=>D.filter(x=>x<=t).length;let cap=c.monto,a=0,i=0;const acc=j=>{if(j>a){i+=(j-a)*(flat?c.interes/c.n:cap*r);a=j}};
c.pagos.forEach(p=>{acc(cm(p.t));if(i<0.5)acc(Math.min(c.n,cm(p.t)+1));i-=p.int;cap-=p.cap});acc(cm(Date.now()));if(pay&&i<0.5){const fu=cst(c,c.pagos.reduce((s,p)=>s+p.int+p.cap,0)).full;acc(Math.min(c.n,Math.max(cm(Date.now())+1,fu+1)))}return{cap,i:Math.max(0,i)}}
function calc(c){if(c.cerrado)return{late:0,mp:0,ip:0,cp:0,tot:0,done:true};const k=calcOld(c),s=sim(c,false);return{...k,ip:s.i,cp:s.cap,tot:k.mp+s.i+s.cap,done:s.cap+s.i<0.5}}
function calcOld(c){const ms=MS[c.unit],paid=sum(c.pagos,'int')+sum(c.pagos,'cap'),ex=dv(c).filter(x=>x+graceMs(c)<=Date.now()).length,late=Math.max(0,ex-cst(c,paid).full),
mp=Math.max(0,moraTot(c,late)+(c.madj||0)-sum(c.pagos,'mora')),ip=c.interes-sum(c.pagos,'int'),cp=c.monto-sum(c.pagos,'cap');
return{late,mp,ip,cp,tot:mp+ip+cp,done:cp+ip<0.5}}
function ncuo(d){let c=0,x=new Date();for(let k=1;k<=d;k++){x.setDate(x.getDate()+1);if(x.getDay()!==0)c++}return c}
const pl=(n,u,nod)=>nod&&u==='día'?ncuo(n):n;
const intr=(m,t,tb,n,u,nod=!!($('#nd')&&$('#nd').checked))=>m*t/100*(tb==='mes'?(nod&&u==='día'?n*864e5:n*MS[u])/MS.mes:1);
function comis(o){const d=new Date(),h0=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),w0=h0-((d.getDay()+6)%7)*864e5,m0=new Date(d.getFullYear(),d.getMonth(),1).getTime(),r={hoy:0,sem:0,mes:0};
S.cre.forEach(c=>c.pagos.filter(p=>pc(p,o)).forEach(p=>{const v=(o.cb==='rec'?p.mora+p.int+p.cap:p.int)*o.com/100;if(p.t>=h0)r.hoy+=v;if(p.t>=w0)r.sem+=v;if(p.t>=m0)r.mes+=v}));
S.cre.filter(c=>c.cob===o.id).forEach(c=>{const v=crc(c,o);if(c.start>=h0)r.hoy+=v;if(c.start>=w0)r.sem+=v;if(c.start>=m0)r.mes+=v});return r}
const mine=()=>RF?S.cre.filter(c=>c.ruta===RF):S.cre;
function login(){$('#who').innerHTML=SYNC.chip()+BCSC.chipBtn();$('#app').innerHTML=`${recov()}<div class="card"><h2>Entrar</h2>
<label>Ingreso como</label><select id="r"><option value="dueño">Propietario</option>${S.cob.map(c=>`<option value="${c.id}">${c.tipo==='rev'?'Revisador':'Cobrador'}: ${esc(c.name)}</option>`).join('')}</select>
<label>Clave (PIN)</label><input id="p" type="password" inputmode="numeric" autocomplete="off">
<p id="e" class="bad"></p><button id="go">Entrar</button> <button id="olv" class="sec">Olvidé mi clave</button>
<p class="mut">Primera vez: el propietario entra con la clave 1234 y debe cambiarla en Cobradores.</p>${(!S.cre.length&&!S.cob.length)?'<label>¿Perdiste los datos? Restaurar desde un respaldo</label><input id="rf" type="file" accept=".json,application/json"><button id="pac" class="sec" style="margin-top:8px">Cargar datos reconstruidos de Pacifico</button><label>O pega aquí el texto de un respaldo</label><textarea id="rt" rows="3" style="width:100%"></textarea><button id="rtb" class="sec" style="margin-top:6px">Restaurar desde el texto</button>':''}</div>`;
const rb=$('#rbak');if(rb)rb.onclick=()=>{S=Object.assign({pin:'1',cob:[],cre:[]},BAKS);mig();SYNC.reset();save();U=null;login()};const rf0=$('#rf');if(rf0)rf0.onchange=()=>{const f=rf0.files[0];if(f)f.text().then(restoreTxt)};const pc0=$('#pac');if(pc0)pc0.onclick=cargarPac;const rtb0=$('#rtb');if(rtb0)rtb0.onclick=()=>restoreTxt($('#rt').value);
const ob=$('#olv');if(ob)ob.onclick=()=>{if(!S.qh){toast('No hay pregunta de recuperación guardada. El propietario debe registrarla al cambiar la clave.');return}dlg('<b>Recuperar la clave del propietario</b><p class="mut">'+esc(S.q)+'</p><label>Respuesta</label><input id="ra" type="password" autocomplete="off"><label>Nueva clave</label><input id="rn2" type="password" inputmode="numeric">',d=>{const p=$('#rn2').value.trim();if(hq($('#ra').value)!==S.qh){$('#de').textContent='La respuesta no coincide';return false}if(p.length<4){$('#de').textContent='La clave debe tener 4 dígitos o más';return false}S.pin=p;save();toast('Clave cambiada. Ya puedes entrar')})};
$('#go').onclick=()=>{const r=$('#r').value,p=$('#p').value;
if(r==='dueño'&&pinEq(p,S.pin))U={role:'dueño',name:'Propietario'};
else{const c=S.cob.find(x=>x.id===r);if(c&&pinEq(p,c.pin))U={role:c.tipo==='rev'?'revisador':'cobrador',id:c.id,name:c.name,com:c.com,tel:c.tel}}
if(!U){$('#e').textContent='Clave incorrecta';return}tab=U.role==='dueño'?'cartera':'cobro';sel=null;RF='';try{const mr=BCSC.myR();if(mr&&mr.length)LR=mr[0]}catch(e){}draw()}}
function draw(){$('#who').innerHTML=`${SYNC.chip()}${BCSC.chipBtn()}<span class="mut" style="color:#fff">${esc(U.role==='revisador'?'🔎 ':'')+esc(U.name)}</span> <button id="out">Salir</button>`;$('#out').onclick=()=>{U=null;login()};
const t=BCSC.tabs();
let h=`<nav>${t.map(([k,v])=>`<button class="${tab===k?'on':''}" data-t="${k}">${v}</button>`).join('')}</nav>`;
h+=sel?detail():tab==='nuevo'?nuevo():tab==='sol'?solv():tab==='veh'?vehv():tab==='cobro'?cobrov():tab==='mora'?morav():tab==='sim'?simv():tab==='rec'?recv():tab==='rep'?repv():tab==='mov'?movv():tab==='cap'?capv():tab==='merc'?mercv():tab==='cli'?clientes():tab==='rutas'?rutasc():tab==='liq'?liqv():tab==='resumen'?resumen():tab==='cob'?cobs():tab==='cal'?calv():cartera();
$('#app').innerHTML=bkBanner()+solBanner()+h;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;EC=null;REF=null;draw()});bind()}
function cartera(){const all=mine().slice().reverse(),np=all.filter(c=>calc(c).done).length,l=SHOWP?all:all.filter(c=>!calc(c).done),o=U.role==='cobrador'&&S.cob.find(x=>x.id===U.id),k=o&&comis(o);return (o?`<div class="card"><b>Mi comisión (${o.com}% del interés cobrado)</b><div class="g"><div>Hoy<br><span class="big">${$$(k.hoy)}</span></div><div>Esta semana<br><span class="big">${$$(k.sem)}</span></div></div><div class="mut">Este mes: ${$$(k.mes)}</div>${pendHtml(o)}</div>`:'')+(S.rutas&&S.rutas.length?`<select id="fr"><option value="">Todas las rutas</option>${S.rutas.map(r=>`<option value="${r.id}" ${r.id===RF?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`:'')+rbx()+`<input id="q" placeholder="Buscar cliente o teléfono">`+(np?`<button id="vp2" class="sec" style="margin:6px 0">${SHOWP?'Ocultar':'Ver'} créditos pagados (${np})</button>`:'')+(l.length?`<div id="lst">${l.map(row).join('')}</div>`:'<div class="card">'+(np?'No hay créditos activos: todos están pagados.':'Aún no hay créditos. Toca “Nuevo crédito” para crear el primero.')+'</div>')+(U.role==='dueño'&&l.length?'<p></p><button id="rz" class="bad">Borrar todos los créditos y empezar de cero</button>':'')}
function row(c){const k=calc(c);return `<div class="card" data-id="${c.id}" data-s="${esc((c.cliente+c.tel+ccod(c)+(c.cod||'')+ccd(c)+artTxt(c)+(c.ref||'')).toLowerCase())}" style="cursor:pointer;border-left:8px solid ${rcol(c.ruta)}"><div class="row"><span><b>${esc(c.cliente)}</b> <span class="mut">${esc(ccod(c))} · ${esc(ccd(c))}</span></span><span class="tag ${k.done?'p':k.late?'m':''}">${c.cerrado==='perd'?'Cerrado':c.cerrado?'Refinanciado':k.done?'Pagado':k.late?k.late+' '+c.unit+'(s) de mora':'Al día'}</span></div><div style="margin:4px 0">${rtag(c.ruta)}${c.tipo==='merc'?' '+(c.items||[]).slice(0,3).map(i=>'<span class="tag" style="white-space:nowrap;background:var(--ln);color:var(--ink)">'+aemo(i.nombre)+' '+esc(i.nombre)+'</span>').join(' '):''}</div><div class="row mut"><span>${c.tipo==='merc'?'Plan de '+c.n+' '+c.unit+'s':c.n+' '+c.unit+'s · '+c.tasa+'%'}</span><b class="big" style="color:var(--ink)">${$$(k.tot)}</b></div>${contactBtns(c,null,'',true)}</div>`}
function nuevo(){return `<div class="card"><h3>Nuevo crédito</h3>${REF?refBanner():''}<div id="rbox"></div><label>Tipo de crédito</label><select id="tp"><option value="din">Dinero</option><option value="merc">Mercadería</option></select><div id="mb2" style="display:none"><label>Categoría</label><select id="ac"></select><label>Artículo del inventario</label><select id="ar"></select><label>Cantidad</label><input id="qa" type="number" inputmode="numeric" value="1"><label>Precio de venta ($)</label><input id="pv2" type="number" step="any" inputmode="decimal"><select id="pt" style="margin-top:6px"><option value="u">El precio es por cada unidad</option><option value="t">El precio es por el total</option></select><button type="button" id="ad" class="sec" style="margin-top:6px">Agregar del inventario</button><div style="border:1px dashed var(--ln);border-radius:12px;padding:10px;margin:10px 0"><b>Artículo escrito a mano</b><p class="mut">Cualquier artículo (colchón, cicla, celular...). No hace falta tenerlo en el inventario. Usa la cantidad y el precio de venta de arriba.</p><label>Artículo</label><input id="fa" placeholder="Ej. Colchón, cicla"><label>Costo total para ti ($; si no lo sabes, 0)</label><input id="fc" type="number" step="any" inputmode="decimal"><button type="button" id="ad2" class="sec" style="margin-top:6px">Agregar este artículo</button></div><div id="cart"></div><p id="ut" class="mut"></p></div>
<label>Ruta</label><select id="ru">${ropts(U.role==='cobrador'?(S.cob.find(x=>x.id===U.id)||{}).ruta:'')}</select><label>Cliente existente de esta ruta</label><select id="ex"></select><label>Nombre</label><input id="cl"><label>Apellido</label><input id="ap"><label>WhatsApp del cliente</label><input id="tl" inputmode="tel"><label>Documento de identidad</label><input id="dc" inputmode="numeric"><label>Dirección</label><input id="di"><label>Ubicación: coordenadas o enlace de Google Maps</label><input id="gp" placeholder="-2.2146, -80.9005"><button type="button" id="gl" class="sec" style="margin-top:6px">Usar mi ubicación actual</button><p id="gm" class="mut"></p>
<div class="g"><div><label>Monto prestado</label><input id="mo" type="number" inputmode="numeric"></div><div><label>Tasa de interés (%)</label><input id="ta" type="number" value="20"></div><div><label>La tasa es</label><select id="tb"><option value="mes">Mensual de 28 días (se prorratea)</option><option value="total">Por todo el plazo</option></select></div>
<div><label>Plazo en</label><select id="un"><option>hora</option><option selected>día</option><option>semana</option><option>quincena</option><option>mes</option></select></div><div><label>Cantidad (por día: días calendario, 28 = 1 mes)</label><input id="nn" type="number" value="20"></div>
<div><label>Cargo por creación ($)</label><input id="cg" type="number" value="0"></div><div><label>Seguro del crédito ($)</label><input id="sg" type="number" value="0"></div></div>
<div id="rfb"><label>Artículo o referencia (opcional, solo para el recibo: no suma ni resta)</label><input id="rf0" placeholder="Ej: Puerta, cama, bicicleta"></div>
<label style="display:flex;gap:8px;align-items:center"><input id="nd" type="checkbox" checked style="width:auto"> No se cobra los domingos (solo créditos por día)</label>
<label style="display:flex;gap:8px;align-items:center"><input id="pm" type="checkbox" style="width:auto"> Cuotas pactadas a mano (valores distintos)</label><div id="pmb" style="display:none"><label>Valores de las cuotas, separados por coma, con punto decimal (ej. 500, 400, 500, 400)</label><input id="pl" placeholder="500, 400, 500, 400"><label style="display:flex;gap:8px;align-items:center"><input id="pa" type="checkbox" checked style="width:auto"> La última cuota se calcula sola con el restante</label><p class="mut">El interés se calcula con el plazo de arriba (cantidad y plazo en), aunque las cuotas se extiendan a más semanas.</p><p id="pp" class="mut"></p></div>
<div id="mpw"><label>Modalidad de mora</label><select id="mm"><option value="m1">1 · Mora fija por período: saldo ÷ 30, solo si paga después de la fecha límite (semanal, quincenal, mensual)</option><option value="m2a">2A · 0,40% diario sobre el saldo total, sin prórroga</option><option value="m2b">2B · 0,70% diario sobre las cuotas vencidas sin pagar</option><option value="m3">3 · Manual: la mora se escribe al cobrar</option></select><label>Valor de mora por período (créditos de mercadería: valor pactado con el cliente)</label><input id="mr" type="number" step="any" inputmode="decimal" placeholder="Automático"><label>Días de prórroga antes de cobrar mora</label><input id="gr" type="number" value="2"></div>
<p class="mut">Por día sin domingos: escribe los días calendario y el sistema calcula los cobros (28 días = 24 cobros). El plazo máximo es 12 meses. El cargo de apertura (5%) y el seguro (4%) se descuentan al entregar el dinero: el cliente recibe el valor menos los descuentos, pero el sistema registra el valor completo más su interés. En mercadería no se cobran. Puedes cambiarlos.</p><p id="e" class="bad"></p><div id="pv" class="mut"></div><button id="mk">Crear crédito</button></div>`}
function bind(){const q=$('#q');if(q)q.oninput=()=>document.querySelectorAll('#lst .card').forEach(c=>c.style.display=c.dataset.s.includes(q.value.toLowerCase())?'':'none');
